<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Date Confirmed ❤️</title>

<style>

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffd6e5,
            #ff9fbd
        );

}

.card {

    width: 90%;

    max-width: 600px;

    background: white;

    padding: 45px;

    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.15);

}

h1 {

    color: #e91e63;

}

.info {

    background: #fff0f5;

    padding: 20px;

    border-radius: 15px;

    margin: 25px 0;

}

button {

    padding: 15px 30px;

    border: none;

    border-radius: 50px;

    background: #e91e63;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}

</style>

</head>


<body>


<div class="card">

    <h1>
        lalamon tayooooo
    </h1>


    <p>
        Buti naman pumayag ka
    </p>


    <div class="info">

        <p>
            📅 <strong>Date:</strong>
        </p>

        <h2 id="date"></h2>


        <p>
            ⏰ <strong>Time:</strong>
        </p>

        <h2 id="time"></h2>

    </div>


    <h2>
        Mag ayos kana ha
    </h2>

    <p>
        Wag babagal bagal ah
    </p>


    <button onclick="nextPage()">

        Ano kakainin?

    </button>

</div>


<script>

const date =
    localStorage.getItem("date");

const time =
    localStorage.getItem("time");


const dateObject =
    new Date(date + "T00:00:00");


document.getElementById("date")
    .textContent =
    dateObject.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );


document.getElementById("time")
    .textContent =
    formatTime(time);


function formatTime(time) {

    const [hours, minutes] =
        time.split(":");

    const date =
        new Date();

    date.setHours(hours);
    date.setMinutes(minutes);

    return date.toLocaleTimeString(
        "en-US",
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


function nextPage() {

    window.location.href =
        "food.html";

}

</script>

</body>

</html>
