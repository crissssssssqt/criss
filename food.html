<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Where Should We Eat?</title>

<style>

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffe0eb,
            #ffb6ce
        );

}

.card {

    width: 90%;

    max-width: 600px;

    background: white;

    padding: 40px;

    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.15);

}

h1 {

    color: #e91e63;

}

.options {

    display: grid;

    gap: 15px;

    margin-top: 30px;

}

button {

    padding: 18px;

    border: 2px solid #ffd0df;

    background: #fff5f8;

    color: #e91e63;

    border-radius: 15px;

    font-size: 18px;

    cursor: pointer;

}

button:hover {

    background: #e91e63;

    color: white;

}

</style>

</head>


<body>


<div class="card">

    <h1>
        Ano kakainin?
    </h1>

    <p>
        Pumili kaaaaa!
    </p>


    <div class="options">

        <button onclick="choose('Street food')">
            Street food
        </button>

        <button onclick="choose('Angels')">
            Angels
        </button>

        <button onclick="choose('Mcdo')">
            Mcdo
        </button>

        <button onclick="choose('Jollibee')">
            Jollibee
        </button>

        <button onclick="choose('Potato corner')">
            Potato corner
        </button>

        <button onclick="choose('Dko alam')">
            ikaw na bahala
        </button>

    </div>

</div>


<script>

function choose(food) {

    localStorage.setItem(
        "food",
        food
    );

    window.location.href =
        "thankyou.html";

}

</script>

</body>

</html>
