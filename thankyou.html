<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Thank You ❤️</title>

<style>

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffb6ce,
            #ff7096
        );

    overflow: hidden;

}

.card {

    width: 90%;

    max-width: 650px;

    background: rgba(255,255,255,0.95);

    padding: 50px 30px;

    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.2);

}

.heart {

    font-size: 90px;

    animation:
        beat 1s infinite;

}

@keyframes beat {

    50% {
        transform: scale(1.2);
    }

}

h1 {

    color: #e91e63;

    font-size: 42px;

}

.love {

    font-size: 55px;

    color: #e91e63;

    font-weight: bold;

    margin: 30px 0;

}

p {

    color: #555;

    font-size: 18px;

}

</style>

</head>


<body>


<div class="card">

    <div class="heart">
        ❤️
    </div>


    <h1>
        Yey salamat!!!
    </h1>


    <p>
        Planado na wag pasusot
    </p>


    <p>
        Eto napili mo ahh
    </p>


    <h2 id="food"></h2>


    <div class="love">

        ILOVEYOU PUKOT ❤️

    </div>


    <p>
        Seeyou!!!
    </p>

</div>


<script>

const food =
    localStorage.getItem("food");


document.getElementById("food")
    .textContent =
    food || "a place we'll both love ❤️";

</script>

</body>

</html>
